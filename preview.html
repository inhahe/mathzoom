<!doctype html>
<!-- Dev aid: draws every extracted glyph large, to verify the TeX->JSON pipeline. -->
<meta charset="utf-8">
<title>glyph preview</title>
<style>html,body{margin:0;background:#fff}</style>
<canvas id="c" width="1800" height="1100"></canvas>
<script src="glyphs.js"></script>
<script>
const ctx = document.getElementById('c').getContext('2d');
const cache = new Map();
function path(d) { let p = cache.get(d); if (!p) cache.set(d, p = new Path2D(d)); return p; }
function drawGlyph(g, x, y, s) {           // glyph's ink box top-left at (x,y), scale s
  for (const part of g.parts) {
    const [a, b, c, d, e, f] = part.m;
    ctx.setTransform(s, 0, 0, s, x, y);
    ctx.transform(a, b, c, d, e, f);
    ctx.fill(path(part.d));
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function box(x, y, w, h) { ctx.strokeStyle = '#e33'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h); }

const G = window.GLYPHS;
const items = [
  ['tower', 30, 30, 7], ['seed', 260, 30, 12], ['cdots', 360, 60, 12], ['vdots', 520, 30, 9],
  ['rbrace20', 600, 30, 3], ['rbrace40', 660, 30, 1.5], ['rbrace80', 720, 30, 0.72], ['rbrace160', 780, 30, 0.35],
  ['ubrace30', 900, 30, 3], ['ubrace60', 900, 90, 1.5], ['ubrace120', 900, 140, 0.75], ['ubrace240', 900, 190, 0.375],
];
ctx.font = '13px sans-serif';
for (const [n, x, y, s] of items) {
  const g = G[n];
  drawGlyph(g, x, y, s);
  box(x, y, g.w * s, g.h * s);          // red box = measured ink bbox; glyph must sit tight inside
  ctx.fillStyle = '#36c'; ctx.fillText(n, x, y + g.h * s + 16); ctx.fillStyle = '#000';
}
</script>
